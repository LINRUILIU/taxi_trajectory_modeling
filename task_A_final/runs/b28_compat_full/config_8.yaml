{
  "strategy": { "name": "b28_compat" },
  "legacy_wrapper": {
    "map_path": "map",
    "cache_path": "task_A_final/caches/map_graph_cache.pkl",
    "args": [
      "--interpolate-mode", "pchip",
      "--path-sampling-mode", "speed-aware",
      "--fusion-mode", "continuous",
      "--low-conf-smooth-threshold", "0.45",
      "--low-conf-smooth-window", "1",
      "--low-conf-smooth-sigma", "1.0",
      "--low-conf-smooth-strength", "0.75",
      "--sharp-turn-align-threshold-deg", "70.0",
      "--sharp-turn-heading-tolerance-deg", "60.0",
      "--sharp-turn-alpha-min", "0.92",
      "--sharp-turn-conf-threshold", "0.20",
      "--high-speed-var-threshold", "2.00",
      "--high-speed-max-turn-deg", "75.0",
      "--high-speed-curvature-iters", "1",
      "--high-speed-curvature-strength", "0.80",
      "--executor-mode", "process",
      "--num-workers", "0",
      "--chunk-size", "256"
    ]
  }
}
